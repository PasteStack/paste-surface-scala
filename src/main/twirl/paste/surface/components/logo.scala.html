@import com.pastestack.surface.view_models.components.Logo

@(logo: Logo)(svgContent: Html)

<a href="@logo.href" class="paste-ui-logo@if(logo.cssClass.nonEmpty){ @logo.cssClass}" aria-label="@logo.ariaLabel">
    <svg width="@logo.width" height="@logo.height" @if(logo.viewBox.nonEmpty){viewBox="@logo.viewBox.get"} role="img">
        <title>@logo.title</title>
        @svgContent
    </svg>
</a>
