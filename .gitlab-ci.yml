# ---------------------------------------------------------------------------
# Shared CI/CD templates from cicd-pipelines
# ---------------------------------------------------------------------------
include:
  - project: 'tomshley/brands/global/tware/tech/products/provisioning/cicd-pipelines'
    ref: 'v0.1.1'
    file:
      - '/gitlab/ci/.stages-base.yml'
      - '/gitlab/ci/.gitflow-base.yml'
      - '/gitlab/ci/.gitflow-branch-policy.yml'
      - '/gitlab/ci/.sbt-runtime.yml'
      - '/gitlab/ci/.container-tags.yml'
      - '/gitlab/ci/.artifact-publish-policy.yml'
      - '/gitlab/ci/.security-scanning.yml'

variables:
  CICD_PIPELINES_RUNNER_TAG: "0.1.1"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
build-sbt:
  extends:
    - .tomshley-sbt-runtime
  stage: build
  script:
    - sbt compile

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test-sbt:
  extends:
    - .tomshley-sbt-runtime
  stage: test
  needs: ["build-sbt"]
  script:
    - sbt test

# ---------------------------------------------------------------------------
# Maven Publish
# ---------------------------------------------------------------------------
maven-publish:
  extends:
    - .tomshley-sbt-runtime
    - .flow-artifact-publish
  stage: deploy
  script:
    - sbt publish
