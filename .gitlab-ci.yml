include:
  - project: 'tomshley/brands/global/tware/tech/products/provisioning/cicd-pipelines'
    ref: 'v0.9.1'
    file: '/adapters/gitlab/ci/adapter.yml'

variables:
  CICD_PIPELINES_RUNNER_TAG: "0.9.1"
  BASE_CONTAINERS_REGISTRY: registry.gitlab.com/tomshley/brands/global/tware/tech/products/provisioning/base-containers
  BASE_CONTAINERS_UPSTREAM_TAG: "0.6.0"
  SBT_OPTS: "-Xmx2G -Dsbt.log.noformat=true"

# Branch and tag pipelines carry the build; merge request pipelines would only
# duplicate them (the adapter's workflow admits both), so they are skipped here.
# Tag pipelines must keep these jobs: the publish job declares `needs` on them.
.runs-on-branch-or-tag:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

compile:
  extends: [.runs-on-branch-or-tag]
  image: ${CICD_PIPELINES_REGISTRY}/cicd-runner-sbtdockertofu:${CICD_PIPELINES_RUNNER_TAG}
  stage: build
  tags: [saas-linux-medium-amd64]
  script:
    - sbt compile Test/compile
  artifacts:
    paths: [target/, project/target/]
    expire_in: 1 day

test:
  extends: [.runs-on-branch-or-tag]
  image: ${CICD_PIPELINES_REGISTRY}/cicd-runner-sbtdockertofu:${CICD_PIPELINES_RUNNER_TAG}
  stage: test
  tags: [saas-linux-medium-amd64]
  needs: [compile]
  script:
    # The route checks run through the Pekko testkit under `sbt test`.
    # The template checks are main classes and must also be named explicitly.
    - sbt test 'Test/runMain com.pastestack.surface.MarqueeRenderingChecks' 'Test/runMain com.pastestack.surface.IncludesRenderingChecks' 'Test/runMain com.pastestack.surface.ImageSequenceRenderingChecks' 'Test/runMain com.pastestack.surface.SectionNavRenderingChecks' 'Test/runMain com.pastestack.surface.FormRenderingChecks' 'Test/runMain com.pastestack.surface.RenderingChecks' 'Test/runMain com.pastestack.surface.SiteDocumentsChecks'

# The recipe resolves the artifact policy, enforces the tag/VERSION guard, and
# exports TOMSHLEY_CICD_BUILD_REVISION for build.sbt's version. The registry
# project is build.sbt's decision, not a second value here.
#
# The recipe publishes one coordinate — the pinnable {ref-slug}-{sha}. A consumer
# cannot track a branch by a version that changes every pipeline, so the rolling
# {ref-slug}-latest coordinate is published after it, the way the house JVM
# publishers do. On a tag both revisions are empty and the clean version publishes
# once, so the second pass is skipped.
publish:
  extends: [.tomshley-cicd-publish-sbt]
  needs: [compile, test]
  before_script:
    # The recipe script resolves the publish policy in its own process, so the
    # job shell needs it too before it can decide whether a rolling pass applies.
    - !reference [.tomshley-cicd-recipe-env, before_script]
    - !reference [.before-artifact-tags, before_script]
  script:
    - bash "${TOMSHLEY_CICD_TOOLBOX_ROOT}/publish/sbt.sh" sbt publish
    - |
      if [ "${CICD_PUBLISH_ROLLING}" = "true" ]; then
        TOMSHLEY_CICD_BUILD_REVISION="${CICD_PUBLISH_ROLLING_TAG}" sbt publish
      fi
